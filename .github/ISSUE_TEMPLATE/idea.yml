name: Idea
description: Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is hard about it today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could the extension help?
